# CI for Godot-LLM-Bridge — the install-path proof for every PR.
#
# GODOT_VERSION policy (owner ruling 2026-10-25: the bridge requires Godot
# 4.8 — nothing less): pin an OFFICIAL release build, checksum-verified.
# 4.8-stable does not exist yet, so CI pins the official 4.8-beta1 milestone
# from godotengine/godot-builds (frozen, immutable assets — as reproducible
# as a stable release; daily dev builds are NOT pinned). Bump to 4.8-stable
# the day it ships (same commit raises nothing — the floor is already 4.8).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.8-beta1"
  # sha256 of Godot_v<ver>_linux.x86_64.zip from the official milestone
  # release (godotengine/godot-builds; 4.8-beta1, verified locally 2026-10-26
  # — the full GD suite passes on this exact binary).
  GODOT_SHA256_LINUX_ZIP: "199b2d6a0daa3a74a697356f31c33347f997f65258ba7dd07ca8c1110757927d"
  GODOT_ZIP_BASE: "https://github.com/godotengine/godot-builds/releases/download"

jobs:
  cli:
    name: CLI tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: CLI test suite (stdlib unittest)
        run: python bridge/tests/test_cli.py
      - name: Version consistency (VERSION == plugin.cfg copies)
        run: python scripts/check_version.py

  gd-headless:
    # NOTE: no ${{ env.* }} in job names — invalid context, GitHub rejects
    # the whole workflow at parse time (zero jobs, 0s failure). Pin is
    # stated in the workflow-level env block below.
    name: GDScript tests (pinned Godot stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot (checksum-verified)
        run: |
          set -euo pipefail
          BIN="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fsSL -o godot.zip "${GODOT_ZIP_BASE}/${GODOT_VERSION}/${BIN}.zip"
          echo "${GODOT_SHA256_LINUX_ZIP}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x "$BIN"
          echo "GODOT=$PWD/$BIN" >> "$GITHUB_ENV"
      - name: Run GD test suite (each test quits 0/1)
        run: |
          set -uo pipefail
          fails=0
          for t in bridge_contract_test human_edit_test script_run_test \
                   scripts_check_test test_bridge_context test_bridge; do
            echo "--- GD test: $t ---"
            if "$GODOT" --headless --path . --script "res://bridge/tests/$t.gd"; then
              echo "GD $t: PASS"
            else
              echo "::error::GD $t: FAIL"
              fails=$((fails + 1))
            fi
          done
          echo "GD failures: $fails"
          exit "$fails"

  integration:
    name: End-to-end bridge (real editor + game, xvfb)
    runs-on: ubuntu-latest
    needs: [cli, gd-headless]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned Godot (checksum-verified)
        run: |
          set -euo pipefail
          BIN="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fsSL -o godot.zip "${GODOT_ZIP_BASE}/${GODOT_VERSION}/${BIN}.zip"
          echo "${GODOT_SHA256_LINUX_ZIP}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x "$BIN"
          echo "GODOT_EDITOR_BINARY=$PWD/$BIN" >> "$GITHUB_ENV"
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Start Xvfb
        # NOTE: bare Xvfb + DISPLAY, NOT xvfb-run — `launch` detaches the
        # editor (start_new_session), so an xvfb-run wrapper would take the
        # X server down when the CLI process exits.
        run: |
          Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Drive the bridge end-to-end
        run: |
          set -uo pipefail
          CLI="python bridge/cli/editor_bridge_cli.py"
          dump_diagnostics() {
            echo "::group::diagnostics"
            echo "--- .tmp/logs/ ---"; tail -n 200 .tmp/logs/* 2>/dev/null || echo "(no logs)"
            echo "--- state.json ---"; cat .tmp/bridge/state.json 2>/dev/null || echo "(no state)"
            $CLI logs get --max-lines 200 || true
            echo "::endgroup::"
          }
          step() {
            local name="$1"; shift
            echo "::group::$name"
            if ! "$@"; then
              echo "::error::STEP FAILED: $name"
              dump_diagnostics
              exit 1
            fi
            echo "::endgroup::"
          }
          step "launch editor"    $CLI launch --force
          step "ping (heartbeat)" $CLI ping
          step "fs-scan"          $CLI action fs-scan --wait
          step "scene-play demo"  $CLI action scene-play --path res://scenes/main.tscn
          # game ping exits 0 with game_bridge:false (envelope is ok:true),
          # so assert the payload field — and note the editor being alive
          # is NOT proof the game bridge bound its port.
          for i in $(seq 1 30); do
            if $CLI game ping 2>/dev/null | grep -q '"game_bridge": *true'; then
              echo "game ping: game_bridge true (try $i)"; break
            fi
            [ "$i" = 30 ] && { echo "::error::game bridge never came up"; dump_diagnostics; exit 1; }
            sleep 1
          done
          step "game scene-info" $CLI game scene-info
          step "scene-stop"      $CLI action scene-stop
          step "editor healthy after stop" $CLI ping
          echo "INTEGRATION OK"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: .tmp/
          if-no-files-found: ignore
          retention-days: 5
